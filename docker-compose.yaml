services:
  node1:
    build: .
    ports:
      - "9001:9000"
    environment:
      NODE_ID: node1
      PEERS: node2:9000,node3:9000

  node2:
    build: .
    ports:
      - "9002:9000"
    environment:
      NODE_ID: node2
      PEERS: node1:9000,node3:9000

  node3:
    build: .
    ports:
      - "9003:9000"
    environment:
      NODE_ID: node3
      PEERS: node1:9000,node2:9000
